; FLEXIcontent
; Language strings needed by Joomla mail templates (com_mails).
; The extension name of the FLEXIcontent component is "FLEXIcontent", so Joomla
; loads this file when rendering or listing its mail templates.

COM_FLEXICONTENT="FLEXIContent"

; Titles and descriptions shown in com_mails
COM_FLEXICONTENT_MAIL_NOTIFICATION_NEW_TITLE="Nouveau contenu soumis"
COM_FLEXICONTENT_MAIL_NOTIFICATION_NEW_DESC="Notification envoyée lorsque de nouveaux contenus sont soumis et publiés immédiatement."
COM_FLEXICONTENT_MAIL_NOTIFICATION_NEW_PENDING_TITLE="Nouveau contenu en attente de publication"
COM_FLEXICONTENT_MAIL_NOTIFICATION_NEW_PENDING_DESC="Notification envoyée quand un nouveau contenu est soumis et nécessite l'approbation de la publication."
COM_FLEXICONTENT_MAIL_NOTIFICATION_EXISTING_TITLE="Le contenu a été mis à jour"
COM_FLEXICONTENT_MAIL_NOTIFICATION_EXISTING_DESC="Notification envoyée lorsque le contenu existant est mis à jour et qu'aucune révision de version n'est nécessaire."
COM_FLEXICONTENT_MAIL_NOTIFICATION_EXISTING_REVIEWAL_TITLE="Contenu mis à jour - révision de version nécessaire"
COM_FLEXICONTENT_MAIL_NOTIFICATION_EXISTING_REVIEWAL_DESC="Notification envoyée lorsque le contenu existant est mis à jour et que la nouvelle version doit être revue."
COM_FLEXICONTENT_MAIL_NOTIFICATION_APPROVAL_REQUEST_TITLE="Demande d'approbation de la publication"
COM_FLEXICONTENT_MAIL_NOTIFICATION_APPROVAL_REQUEST_DESC="Notification envoyée lorsqu'un utilisateur demande l'approbation de publication d'un élément de contenu."

; Default subjects and bodies of the notification templates
FLEXI_NF_MAIL_SUBJECT_NEW="[{SITENAME}] Nouveau contenu soumis : {TITLE}"
FLEXI_NF_MAIL_BODY_NEW="Nouveau contenu soumis\n\nTitre : {TITLE}\nÉtat : {STATE}\nAuteur : {CREATOR}\nÉditeur : {EDITOR_NAME} ({EDITOR_USERNAME})\nCréé le : {CREATED}\n\nCatégories : {CATEGORIES}\n\n{CATEGORY_TEXT}\n\n{NOTIFY_TEXT}\n\nChamps personnalisés :\n{FIELDS}\n\nAfficher : {VIEW_URL}\nModification front-end : {EDIT_URL_FE}\nModification back-end : {EDIT_URL_BE}"

FLEXI_NF_MAIL_SUBJECT_NEW_PENDING="[{SITENAME}] Nouveau contenu en attente de publication : {TITLE}"
FLEXI_NF_MAIL_BODY_NEW_PENDING="Nouveau contenu en attente de publication\n\nTitre : {TITLE}\nÉtat : {STATE}\nAuteur : {CREATOR}\nÉditeur : {EDITOR_NAME} ({EDITOR_USERNAME})\nCréé : {CREATED}\n\nCatégories : {CATEGORIES}\n\n{CATEGORY_TEXT}\n\n{NOTIFY_TEXT}\n\nChamps personnalisés :\n{FIELDS}\n\nVue : {VIEW_URL}\nÉdition Frontend : {EDIT_URL_FE}\nModification Backend : {EDIT_URL_BE}"

FLEXI_NF_MAIL_SUBJECT_EXISTING="[{SITENAME}] Contenu mis à jour : {TITLE}"
FLEXI_NF_MAIL_BODY_EXISTING="Contenu mis à jour\n\nTitre : {TITLE}\nÉtat : {STATE}\nAuteur : {CREATOR}\nDernier éditeur : {MODIFIER}\nÉditeur : {EDITOR_NAME} ({EDITOR_USERNAME})\nCréé le : {CREATED}\nModifié le : {MODIFIED}\n\nCatégories : {CATEGORIES}\nAjouté aux catégories : {CATEGORIES_ADDED}\nRetiré des catégories : {CATEGORIES_REMOVED}\n\n{CATEGORY_TEXT}\n\n{NOTIFY_TEXT}\n\nChamps personnalisés :\n{FIELDS}\n\nAfficher : {VIEW_URL}\nModification front-end : {EDIT_URL_FE}\nModification back-end : {EDIT_URL_BE}"

FLEXI_NF_MAIL_SUBJECT_EXISTING_REVIEWAL="[{SITENAME}] Contenu mis à jour - révision nécessaire : {TITLE}"
FLEXI_NF_MAIL_BODY_EXISTING_REVIEWAL="Mise à jour du contenu\n\nTitre : {TITLE}\nÉtat : {STATE}\nAuteur : {CREATOR}\nDernier éditeur : {MODIFIER}\nÉditeur : {EDITOR_NAME} ({EDITOR_USERNAME})\nCréé : {CREATED}\nModifié : {MODIFIED}\n\nCatégories : {CATEGORIES}\nAjouté aux catégories : {CATEGORIES_ADDED}\nAjouté aux catégories : {CATEGORIES_REMOVED}\n\n{CATEGORY_TEXT}\n\n{NOTIFY_TEXT}\n\nChamps personnalisés :\n{FIELDS}\n\nVue : {VIEW_URL}\nÉdition Frontend : {EDIT_URL_FE}\nÉdition de en admministration: {EDIT_URL_BE} \n \n \n \n Champs personnalisés"

FLEXI_NF_MAIL_SUBJECT_APPROVAL_REQUEST="[{SITENAME}] Demande d'approbation : {TITLE}"
FLEXI_NF_MAIL_BODY_APPROVAL_REQUEST="Demande d'approbation\n\nL'utilisateur {EDITOR_NAME} ({EDITOR_USERNAME}) demande l'approbation de publication pour l'élément de contenu suivant.\n\nTitre : {TITLE}\nÉtat : {STATE}\nAuteur : {CREATOR}\nCréé le : {CREATED}\n\nCatégories : {CATEGORIES}\n\n{CATEGORY_TEXT}\n\n{NOTIFY_TEXT}\n\nChamps personnalisés :\n{FIELDS}\n\nAfficher : {VIEW_URL}\nModification front-end : {EDIT_URL_FE}\nModification back-end : {EDIT_URL_BE}"

