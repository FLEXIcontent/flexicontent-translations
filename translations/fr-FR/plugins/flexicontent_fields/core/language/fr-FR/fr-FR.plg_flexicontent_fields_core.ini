FLEXI_FIELD_VOTE_REVIEWS_LOADER="Indicateur de chargement"
FLEXI_FIELD_VOTE_REVIEWS_LOADER_DESC="Afficher un chargeur (spinner) pendant que les avis suivants sont chargés par défilement dans la fenêtre modale, et la fin de la liste (&quot;C'est tout&quot;) après la dernière révision"
FLEXI_FIELD_VOTE_REVIEWS_STORE_RATING="Enregistrer les notes sans avis"
FLEXI_FIELD_VOTE_REVIEWS_STORE_RATING_DESC="<b>Non</b>: voter avec les étoiles ne crée pas un enregistrement de revue, les votes sont protégés contre le double vote par la session / adresse IP (comme le champ de vote sans révisions). L'évaluation d'une révision est toujours un vote sur le point.<br><b>Oui</b>: un utilisateur connecté votant avec les étoiles obtient un enregistrement de revue sans texte (il n'est pas affiché dans le site), ceci permet un vote unique par compte utilisateur, qui peut être modifié depuis n'importe quel navigateur. Ces enregistrements sont listés dans le gestionnaire d'avis comme &quot;seulement&quot;."
FLEXI_FIELD_VOTE_REVIEWS_USEFUL="Votes utiles des avis"
FLEXI_FIELD_VOTE_REVIEWS_USEFUL_DESC="Affichez sous chaque revue le nombre de personnes qui l'ont trouvé utile, et la question \"Était-ce utile ?\" avec les boutons Oui/Non\". Les utilisateurs ne peuvent pas voter pour leur propre avis"
