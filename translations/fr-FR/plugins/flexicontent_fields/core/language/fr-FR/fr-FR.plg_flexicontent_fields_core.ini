FLEXI_FIELD_VOTE_SHOW_RATING_LABEL_DESC="Show the rating label (e.g. 'Average rating') above the stars, in the item view and in the lists. The label text can be changed in the next option"
FLEXI_FIELD_VOTE_RATING_RESOLUTION="Résolution du vote<br/><small>pour les nouveaux sites OU *</small>"
FLEXI_FIELD_VOTE_RATING_RESOLUTION_DESC="Ceci est à utiliser lors de la construction de nouveaux sites ou ... lisez ci-dessous. <br/>La résolution intégrée de Joomla! est de 5 <br/><br/><b>NOTE :</b> La modification de cette résolution dans les sites existants rendra la moyenne de notation erronée !! <br/><br/><b>REMARQUE :</b> (pour les développeurs) Il est possible de mettre à jour la table d'évaluation avec une requête SQL comme: <br/><i>UPDATE nnn_content_rating SET rating_sum = rating_sum * (_new_resolution_ / _old_resolution_)</i> <br/>et même pour TABLE nnn_flexicontent_items_extravote, <br/>SAUVEGARDER ces 2 tables avant de faire la requête SQL  <br/><br/><b>REMARQUE:</b> Ceci va faire afficher les évaluations de vote WRONGLY, non FLEXIcontent. ne changez donc pas cela si vous utilisez des extensions non-FLEXIcontent pour afficher les évaluations"
FLEXI_FIELD_VOTE_RATING_STARS="Etoiles de vote  <br/><small>résolution &gt;= étoiles</small>"
FLEXI_FIELD_VOTE_RATING_STARS_DESC="Le nombre d'étoiles affichées par Joomla est également de 5. <br/><br/><b>NOTE :</b> Doit être : résolution &gt;= étoiles <br/><br/><b>EXEMPLES:</b><br/>-- 10 étoiles avec un vote demi étoile, définition de résolution : 20, Étoiles 10 <br/>-- 5 étoiles avec vote de quart étoile, résolution réglée : 20, Étoiles : 5 <br/>- 10 étoiles avec vote d'une étoile, résolution réglée : 10, étoiles: 10"
FLEXI_FIELD_VOTE_PERMISSIONS="Permission"
FLEXI_FIELD_VOTE_PERMISSIONS_DESC="Vous pouvez configurer qui a le droit de soumettre un vote, le message qui sera affiché pour ceux qui n'ont pa le droit etc."
FLEXI_FIELD_VOTE_SUBMIT_ACCESS="Accès à la soumission"
FLEXI_FIELD_VOTE_SUBMIT_ACCESS_DESC="Le groupe d'utilisateurs affecté à ce niveau d'accès sera en mesure de voter. <br/><br/>- e. <b>créez un niveau d'accès 'Vote de contenu'</b> et assignez-le aux groupes d'utilisateurs dont vous avez besoin <br/><br/><b>REMARQUE:</b> Vous n'avez qu'à l'assigner au groupe d'utilisateurs parent. Si vous assignez ce niveau d'accès au groupe d'utilisateurs 'Enregistré', alors TOUS les groupes d'utilisateurs qui en sont enfants le verront ..."
