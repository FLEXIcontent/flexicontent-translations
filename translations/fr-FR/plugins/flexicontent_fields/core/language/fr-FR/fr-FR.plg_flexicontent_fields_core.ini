FLEXI_FIELD_VOTE_REVIEWS_INLINE_INFO="<b>Mode linéaire :</b> les étoiles et le bouton de revue sont affichés là où ce champ est placé, mais la liste des avis est affichée par le modèle d'élément, ajoutez ce code où la liste devrait apparaître (e. . - à la fin de l’article. hp du template): <br/><code>&lt;?php echo $item-&gt;fields['voting']->display_reviews; ?&gt;</code><br/>Les modèles FLEXIcontent par défaut l'incluent déjà, le champ doit être dans une position de champ ou dans la position de rendu du template."
